<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ชีตข้อมูล S45</title>

<!-- ไอคอนหน้าจอโฮม: iPhone/iPad -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ชีตข้อมูล S45">

<!-- ไอคอนหน้าจอโฮม: Android/Chrome -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101116">

<link rel="icon" type="image/png" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=Sarabun:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#101116;
    --panel:#181a22;
    --panel-2:#1e212c;
    --border:#2a2d3a;
    --amber:#FFB238;
    --teal:#33D6B0;
    --text:#EDEBE6;
    --muted:#8b8fa3;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    background:
      radial-gradient(ellipse 900px 500px at 85% 110%, rgba(51,214,176,.08), transparent 60%),
      radial-gradient(ellipse 700px 400px at 10% -10%, rgba(255,178,56,.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Sarabun',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:400px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:40px 30px;
    text-align:center;
  }
  .logo{
    width:88px;
    margin-bottom:20px;
    border-radius:20px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:2px;
    color:var(--teal);
    margin:0 0 6px;
  }
  h1{
    font-family:'Kanit',sans-serif;
    font-weight:700;
    font-size:22px;
    margin:0 0 10px;
  }
  p.desc{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    margin:0 0 28px;
  }
  a.open-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    background:var(--teal);
    color:#06231c;
    text-decoration:none;
    font-family:'Kanit',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:15px 20px;
    border-radius:10px;
    transition:transform .1s, background .15s;
  }
  a.open-btn:hover{ background:#4fe3c3; }
  a.open-btn:active{ transform:scale(.98); }

  .hint{
    margin-top:18px;
    font-size:12px;
    color:#565a6b;
    line-height:1.6;
  }
</style>
</head>
<body>

<div class="card">
  <img class="logo" src="icon-192.png" alt="S45 logo">
  <p class="eyebrow">// WORK LOG</p>
  <h1>ชีตข้อมูลงานที่ส่ง</h1>
  <p class="desc">บันทึกงานทั้งหมดที่ส่งผ่านระบบ Video editor ส่งงานแล้ว แยกตามเดือนอัตโนมัติ</p>

  <a class="open-btn" href="https://docs.google.com/spreadsheets/d/1VXyo_3HUCSWyVRSlwgcRmMZvYtsLWlL6MctC2TWg55o/edit" target="_blank" rel="noopener">
    เปิด Google Sheet ↗
  </a>

  <p class="hint">ต้องล็อกอินด้วยบัญชี Google ที่มีสิทธิ์เข้าถึงชีตนี้อยู่แล้ว</p>
</div>

</body>
</html>
